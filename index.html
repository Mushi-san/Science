<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRADIUS MVP - HTML5 / Web Audio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050508;
      --panel-bg: #10121a;
      --border-color: #2a3147;
      --cyan: #00f0ff;
      --laser-blue: #00bfff;
      --red: #ff3344;
      --yellow: #ffdd33;
      --orange: #ff8800;
      --green: #33ff66;
      --powerup-active: #ffdd00;
      --powerup-inactive: #1c2233;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    /* CRT Frame & Cabinet Glow */
    #arcade-cabinet {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #171b29 0%, #0a0b10 100%);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), 0 0 10px rgba(0, 0, 0, 0.9);
      border: 2px solid #202636;
      max-width: 100vw;
    }

    /* Header Scoreboard */
    #hud-top {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      padding: 6px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #aaa;
      background-color: #0b0d14;
      border: 1px solid #1a2030;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }

    #hud-top span.value {
      color: #fff;
      margin-left: 6px;
    }

    #hud-top span.highlight {
      color: var(--yellow);
    }

    #hud-top span.cyan {
      color: var(--cyan);
    }

    /* Screen Wrapper */
    #screen-wrapper {
      position: relative;
      width: 800px;
      height: 450px;
      max-width: 100vw;
      max-height: calc(100vw * 9 / 16);
      background: #000;
      border: 2px solid #2b354d;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Scanlines and vignette */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Power Up Bar (Gradius Iconical Meter) */
    #hud-bottom {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: center;
      background: #0c0e17;
      padding: 8px 10px;
      border: 1px solid #1a2030;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }

    .power-meter {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      width: 100%;
    }

    .gauge-cell {
      background-color: var(--powerup-inactive);
      border: 2px solid #36415d;
      color: #6d7c9f;
      text-align: center;
      padding: 6px 2px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: all 0.08s ease;
      position: relative;
      border-radius: 2px;
    }

    .gauge-cell.selected {
      background-color: #ffe600 !important;
      color: #000 !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 12px #ffe600;
      animation: blink 0.25s infinite alternate;
    }

    .gauge-cell.equipped {
      border-color: var(--cyan);
      color: #ffffff;
      background-color: #123048;
    }

    @keyframes blink {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }

    /* Start / Overlay UI */
    #overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 12, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }

    .title-logo {
      font-size: 38px;
      font-style: italic;
      color: #fff;
      text-shadow: 0 0 15px var(--cyan), 3px 3px 0px #0055aa;
      margin-bottom: 12px;
      letter-spacing: 3px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--yellow);
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .start-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      padding: 12px 28px;
      background: linear-gradient(180deg, #ff4455, #bb1122);
      color: #fff;
      border: 2px solid #ffaa99;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 68, 85, 0.6);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 24px rgba(255, 68, 85, 0.9);
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .instructions {
      margin-top: 24px;
      font-size: 9px;
      line-height: 1.8;
      color: #92a4c8;
      max-width: 600px;
      background: rgba(16, 22, 38, 0.7);
      padding: 12px 16px;
      border: 1px solid #23304c;
      border-radius: 6px;
    }

    .key-badge {
      display: inline-block;
      padding: 2px 6px;
      background: #253350;
      color: #fff;
      border: 1px solid #485c88;
      border-radius: 3px;
      margin: 0 2px;
    }

    /* Mobile Controls */
    #mobile-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      margin-top: 8px;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 3px;
    }

    .btn-mobile {
      background: rgba(40, 52, 78, 0.85);
      border: 2px solid #5a729e;
      color: #fff;
      font-family: inherit;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      touch-action: manipulation;
    }

    .btn-mobile:active, .btn-mobile.pressed {
      background: #00f0ff;
      color: #000;
    }

    .action-container {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 9px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-shot {
      background: linear-gradient(135deg, #ff4455, #991122);
      border: 2px solid #ffa4ac;
      box-shadow: 0 0 10px rgba(255, 68, 85, 0.4);
    }

    .btn-power {
      background: linear-gradient(135deg, #ffbb00, #b27b00);
      border: 2px solid #ffe688;
      box-shadow: 0 0 10px rgba(255, 187, 0, 0.4);
    }

    @media (max-width: 860px) {
      #screen-wrapper {
        width: 100vw;
        height: 56.25vw;
      }
      #hud-top {
        font-size: 9px;
        padding: 4px 8px;
      }
      .gauge-cell {
        font-size: 7px;
        padding: 4px 1px;
      }
      #mobile-controls {
        display: flex;
      }
      .title-logo {
        font-size: 26px;
      }
      .instructions {
        font-size: 8px;
      }
    }
  </style>
</head>
<body>

  <div id="arcade-cabinet">
    <!-- Top HUD -->
    <div id="hud-top">
      <div>1P <span id="score-val" class="value highlight">000000</span></div>
      <div>HI <span id="hiscore-val" class="value">050000</span></div>
      <div>REST <span id="lives-val" class="value cyan">3</span></div>

    <!-- Screen with Canvas and Overlay -->
    <div id="screen-wrapper">
      <canvas id="gameCanvas" width="640" height="360"></canvas>
      <div class="scanlines"></div>

      <!-- Overlay Screen for Title, Game Over, Stage Clear -->
      <div id="overlay-screen">

        <button id="m-up" class="btn-mobile">▲</button>

        <button id="m-left" class="btn-mobile">◀</button>
        <div></div>
        <button id="m-right" class="btn-mobile">▶</button>
        <div></div>

        <button id="m-power" class="btn-mobile btn-action btn-power">POWER<br><small>X</small></button>
      </div>
    </div>
  </div>

<script>
/**
 * GRADIUS MVP - HTML5 / Web Audio implementation
 * Features:
 * - Parallax Space & Terrains (Volcano / Cave)
 * - Vic Viper ship with afterburner trail
 * - Iconical 6-step Gradius Power Meter: Speed Up, Missile, Double, Laser, Option, Shield
 * - Options trail recorder (replicating historical Gradius queue system)
 * - Formations of Red/Blue Enemies, Ground Cannons, Egg Hatchers
 * - Boss Encounter: BIG CORE with 4 Laser Cannons and Core Barrier
 * - Web Audio API 8-bit Sound Generator (BGM + Explosions + Lasers + Powerups)
 */

// ==========================================
// 1. WEB AUDIO SYNTHESIZER & SOUND EFFECTS
// ==========================================
class SoundFX {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmOscs = [];
    this.bgmInterval = null;
    this.bgmStep = 0;
    this.bgmPlaying = false;
    this.isBossTheme = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }

  playTone(freq, type, duration, gainStart = 0.1, gainEnd = 0.001) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainStart, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(gainEnd, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  }

  playNoise(duration, gainStart = 0.2) {
    if (this.muted || !this.ctx) return;
    try {
      const bufferSize = this.ctx.sampleRate * duration;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(gainStart, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      noise.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    } catch(e) {}
  }

  shot() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch(e) {}
  }

  laser() {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.linearRampToValueAtTime(600, now + 0.15);
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    } catch(e) {}
  }

  capsule() {
    this.playTone(880, 'square', 0.06, 0.1);
    setTimeout(() => this.playTone(1320, 'square', 0.08, 0.12), 60);
  }

  powerUp() {
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      setTimeout(() => this.playTone(freq, 'triangle', 0.1, 0.15), idx * 45);
    });
  }

  explosion() {
    this.playNoise(0.25, 0.25);
    this.playTone(120, 'sawtooth', 0.25, 0.2, 0.01);
  }

  bossExplosion() {
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        this.playNoise(0.4, 0.35);
        this.playTone(80 + Math.random() * 80, 'sawtooth', 0.4, 0.25);
      }, i * 140);
    }
  }

  warning() {
    this.playTone(800, 'sawtooth', 0.15, 0.15);
    setTimeout(() => this.playTone(600, 'sawtooth', 0.15, 0.15), 160);
  }

  playerDie() {
    this.playNoise(0.6, 0.35);
    this.playTone(300, 'sawtooth', 0.5, 0.2, 0.01);
  }

  startBGM(isBoss = false) {
    if (!this.ctx) return;
    this.isBossTheme = isBoss;
    this.stopBGM();
    this.bgmPlaying = true;
    this.bgmStep = 0;

    // Gradius-inspired Chiptune melodies & bass
    const stageBass = [110, 110, 130.81, 110, 146.83, 110, 130.81, 164.81];
    const stageMelody = [
      440, 0, 523.25, 659.25, 587.33, 440, 523.25, 0,
      659.25, 783.99, 880, 0, 783.99, 659.25, 587.33, 523.25
    ];

    const bossBass = [73.42, 73.42, 82.41, 73.42, 87.31, 82.41, 73.42, 65.41];
    const bossMelody = [
      293.66, 329.63, 349.23, 293.66, 440, 392, 349.23, 329.63,
      293.66, 0, 440, 0, 415.3, 392, 369.99, 349.23
    ];

    const intervalTime = isBoss ? 115 : 135;

    this.bgmInterval = setInterval(() => {
      if (this.muted || !this.ctx || !this.bgmPlaying) return;
      
      const bassSeq = this.isBossTheme ? bossBass : stageBass;
      const melSeq = this.isBossTheme ? bossMelody : stageMelody;

      const bassFreq = bassSeq[this.bgmStep % bassSeq.length];
      const melFreq = melSeq[this.bgmStep % melSeq.length];

      // Bass note
      if (bassFreq > 0) {
        this.playTone(bassFreq, 'triangle', 0.12, 0.07, 0.005);
      }
      // Lead melody
      if (melFreq > 0) {
        this.playTone(melFreq, 'square', 0.1, 0.05, 0.005);
      }
      // Beat snare / hi-hat
      if (this.bgmStep % 2 === 1) {
        this.playNoise(0.03, 0.03);
      }

      this.bgmStep++;
    }, intervalTime);
  }

  stopBGM() {
    this.bgmPlaying = false;
    if (this.bgmInterval) {
      clearInterval(this.bgmInterval);
      this.bgmInterval = null;
    }
  }
}

const sound = new SoundFX();

// ==========================================
// 2. GAME ENGINE & STATE MANAGEMENT
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 640;
const H = 360;

// UI Elements
const scoreValEl = document.getElementById('score-val');
const hiscoreValEl = document.getElementById('hiscore-val');
const livesValEl = document.getElementById('lives-val');
const stageValEl = document.getElementById('stage-val');
const overlayEl = document.getElementById('overlay-screen');
const btnStartEl = document.getElementById('btn-start');
const gaugeCells = [0, 1, 2, 3, 4, 5].map(i => document.getElementById(`gauge-${i}`));

// Input State
const keys = {
  up: false,
  down: false,
  left: false,
  right: false,
  shot: false,
  power: false
};

// Keyboard Listeners
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
  handleKey(e.code, true);
});

window.addEventListener('keyup', (e) => {
  handleKey(e.code, false);
});

function handleKey(code, pressed) {
  if (code === 'ArrowUp' || code === 'KeyW') keys.up = pressed;
  if (code === 'ArrowDown' || code === 'KeyS') keys.down = pressed;
  if (code === 'ArrowLeft' || code === 'KeyA') keys.left = pressed;
  if (code === 'ArrowRight' || code === 'KeyD') keys.right = pressed;
  if (code === 'KeyZ' || code === 'Space') {
    if (pressed && !keys.shot) game.triggerShot();
    keys.shot = pressed;
  }
  if (code === 'KeyX' || code === 'Enter') {
    if (pressed && !keys.power) game.triggerPowerUp();
    keys.power = pressed;
  }
  if (pressed && code === 'KeyP') {
    game.togglePause();
  }
  if (pressed && code === 'KeyM') {
    const isMuted = sound.toggleMute();
    game.addFloatingText(isMuted ? "SOUND: OFF" : "SOUND: ON", 60, 40, '#ffcc00');
  }
}

// Mobile Touch Setup
function setupMobileBtn(id, keyName, isTrigger = false) {
  const btn = document.getElementById(id);
  if (!btn) return;

  const start = (e) => {
    e.preventDefault();
    sound.init();
    btn.classList.add('pressed');
    if (isTrigger) {
      if (keyName === 'shot') game.triggerShot();
      if (keyName === 'power') game.triggerPowerUp();
    }
    keys[keyName] = true;
  };
  const end = (e) => {
    e.preventDefault();
    btn.classList.remove('pressed');
    keys[keyName] = false;
  };

  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
}

setupMobileBtn('m-up', 'up');
setupMobileBtn('m-down', 'down');
setupMobileBtn('m-left', 'left');
setupMobileBtn('m-right', 'right');
setupMobileBtn('m-shot', 'shot', true);
setupMobileBtn('m-power', 'power', true);

// ==========================================
// 3. GAME ENTITIES & MECHANICS
// ==========================================

class StarField {
  constructor() {
    this.layers = [
      { speed: 0.5, stars: [] },
      { speed: 1.2, stars: [] },
      { speed: 2.5, stars: [] }
    ];
    for (let l = 0; l < 3; l++) {
      const count = 35 + l * 25;
      for (let i = 0; i < count; i++) {
        this.layers[l].stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          color: l === 0 ? '#445588' : l === 1 ? '#88aaee' : '#ffffff',
          size: l === 2 ? (Math.random() > 0.8 ? 2 : 1.5) : 1
        });
      }
    }
  }

  update() {
    for (let l = 0; l < 3; l++) {
      const layer = this.layers[l];
      for (let star of layer.stars) {
        star.x -= layer.speed;
        if (star.x < 0) {
          star.x = W + Math.random() * 10;
          star.y = Math.random() * H;
        }
      }
    }
  }

  draw(ctx) {
    for (let l = 0; l < 3; l++) {
      const layer = this.layers[l];
      for (let star of layer.stars) {
        ctx.fillStyle = star.color;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
    }
  }
}

class TerrainSystem {
  constructor() {
    this.topHeights = [];
    this.bottomHeights = [];
    this.segmentWidth = 32;
    this.count = Math.ceil(W / this.segmentWidth) + 3;
    this.offsetX = 0;
    this.speed = 1.0;
    this.caveActive = false;
    this.initTerrains();
  }

  initTerrains() {
    for (let i = 0; i < this.count; i++) {
      this.topHeights.push(15);
      this.bottomHeights.push(15);
    }
  }

  update(worldDistance) {
    this.offsetX -= this.speed;
    if (this.offsetX <= -this.segmentWidth) {
      this.offsetX += this.segmentWidth;
      this.topHeights.shift();
      this.bottomHeights.shift();

      // Cave / mountain terrain pattern
      let newTop = 15;
      let newBottom = 15;

      if (worldDistance > 400 && worldDistance < 2200) {
        this.caveActive = true;
        const wave1 = Math.sin(worldDistance * 0.008) * 35;
        const wave2 = Math.cos(worldDistance * 0.015) * 20;
        newTop = Math.max(15, 45 + wave1 + wave2);
        newBottom = Math.max(15, 50 - wave1 + wave2);
      } else {
        this.caveActive = false;
      }

      this.topHeights.push(newTop);
      this.bottomHeights.push(newBottom);
    }
  }

  draw(ctx) {
    ctx.fillStyle = '#4a3b32';
    ctx.strokeStyle = '#c49a6c';
    ctx.lineWidth = 2;

    // Top Terrains
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let i = 0; i < this.topHeights.length; i++) {
      const x = i * this.segmentWidth + this.offsetX;
      ctx.lineTo(x, this.topHeights[i]);
    }
    ctx.lineTo(W, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Bottom Terrains
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let i = 0; i < this.bottomHeights.length; i++) {
      const x = i * this.segmentWidth + this.offsetX;
      ctx.lineTo(x, H - this.bottomHeights[i]);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Add crater detailing
    ctx.fillStyle = '#2d221c';
    for (let i = 0; i < this.topHeights.length; i += 2) {
      const x = i * this.segmentWidth + this.offsetX;
      if (this.topHeights[i] > 25) {
        ctx.fillRect(x + 4, this.topHeights[i] - 12, 12, 6);
      }
      if (this.bottomHeights[i] > 25) {
        ctx.fillRect(x + 4, H - this.bottomHeights[i] + 4, 12, 6);
      }
    }
  }

  isColliding(x, y, radius = 6) {
    const idx = Math.floor((x - this.offsetX) / this.segmentWidth);
    if (idx >= 0 && idx < this.topHeights.length) {
      if (y - radius <= this.topHeights[idx]) return true;
      if (y + radius >= H - this.bottomHeights[idx]) return true;
    }
    return false;
  }
}

// Vic Viper Ship
class Player {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = 80;
    this.y = H / 2;
    this.w = 28;
    this.h = 12;
    this.baseSpeed = 2.4;
    this.speedLevel = 0;
    this.alive = true;
    this.invulnerableTimer = 120; // 2 seconds on spawn

    // Power Up Inventory
    this.meterIndex = -1; // 0 to 5, -1 means no selection
    this.hasMissile = false;
    this.hasDouble = false;
    this.hasLaser = false;
    this.optionCount = 0;
    this.shieldHP = 0; // 0 means no shield, max 8

    // Position history for Options trailing
    this.history = [];
    for (let i = 0; i < 60; i++) {
      this.history.push({ x: this.x, y: this.y });
    }

    this.shotCooldown = 0;
    this.missileCooldown = 0;
  }

  get speed() {
    return this.baseSpeed + this.speedLevel * 0.8;
  }

  update() {
    if (!this.alive) return;

    if (this.invulnerableTimer > 0) this.invulnerableTimer--;

    let dx = 0;
    let dy = 0;
    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;

    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }

    this.x += dx * this.speed;
    this.y += dy * this.speed;

    // Boundaries
    const margin = 10;
    this.x = Math.max(margin + 10, Math.min(W - margin - 30, this.x));
    this.y = Math.max(margin + 5, Math.min(H - margin - 10, this.y));

    // Record position for Options
    this.history.unshift({ x: this.x, y: this.y });
    if (this.history.length > 70) {
      this.history.pop();
    }

    // Auto-fire while holding key
    if (this.shotCooldown > 0) this.shotCooldown--;
    if (this.missileCooldown > 0) this.missileCooldown--;
    if (keys.shot && this.shotCooldown <= 0) {
      game.triggerShot();
    }
  }

  draw(ctx) {
    if (!this.alive) return;

    // Invulnerability flashing
    if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0) {
      return;
    }

    // Draw Options
    this.drawOptions(ctx);

    // Draw Vic Viper Craft
    ctx.save();
    ctx.translate(this.x, this.y);

    // Afterburner engine flame
    const flameLen = 6 + Math.random() * 8;
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.moveTo(-14, -2);
    ctx.lineTo(-14 - flameLen, 0);
    ctx.lineTo(-14, 2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffff66';
    ctx.beginPath();
    ctx.moveTo(-14, -1);
    ctx.lineTo(-14 - flameLen * 0.6, 0);
    ctx.lineTo(-14, 1);
    ctx.closePath();
    ctx.fill();

    // Wings (Blue & White)
    ctx.fillStyle = '#0066cc';
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.lineTo(-12, -7);
    ctx.lineTo(2, -2);
    ctx.lineTo(-12, 7);
    ctx.closePath();
    ctx.fill();

    // Fuselage (White Aerodynamic Body)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-14, -3);
    ctx.lineTo(6, -3);
    ctx.lineTo(15, -1);
    ctx.lineTo(15, 1);
    ctx.lineTo(6, 3);
    ctx.lineTo(-14, 3);
    ctx.closePath();
    ctx.fill();

    // Twin Needle Nose (Vic Viper Signature)
    ctx.fillStyle = '#0088ff';
    ctx.fillRect(6, -4, 8, 2);
    ctx.fillRect(6, 2, 8, 2);

    // Cockpit Canopy (Cyan Glow)
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(-2, -2, 6, 4);

    // Red highlight accent
    ctx.fillStyle = '#ff3344';
    ctx.fillRect(-8, -1, 4, 2);

    ctx.restore();

    // Draw Energy Shield
    if (this.shieldHP > 0) {
      ctx.save();
      const pulse = Math.sin(Date.now() * 0.015) * 2;
      ctx.strokeStyle = this.shieldHP > 3 ? '#00f0ff' : '#ff4444';
      ctx.lineWidth = 2.5;
      ctx.fillStyle = this.shieldHP > 3 ? 'rgba(0, 240, 255, 0.25)' : 'rgba(255, 68, 68, 0.25)';

      // Front Barrier 1
      ctx.beginPath();
      ctx.arc(this.x + 24, this.y - 6, 9 + pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Front Barrier 2
      ctx.beginPath();
      ctx.arc(this.x + 24, this.y + 6, 9 + pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }
  }

  drawOptions(ctx) {
    if (this.optionCount === 0) return;

    for (let i = 1; i <= this.optionCount; i++) {
      const delayIndex = i * 14;
      if (this.history[delayIndex]) {
        const optPos = this.history[delayIndex];
        ctx.save();
        ctx.translate(optPos.x, optPos.y);

        // Pulsing glowing orb
        const rad = 7 + Math.sin(Date.now() * 0.01 + i) * 1.5;
        const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, rad);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, '#ff9900');
        grad.addColorStop(1, 'rgba(255, 68, 0, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffaa';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }
  }

  getOptionPositions() {
    const list = [];
    for (let i = 1; i <= this.optionCount; i++) {
      const delayIndex = i * 14;
      if (this.history[delayIndex]) {
        list.push(this.history[delayIndex]);
      }
    }
    return list;
  }
}

// Power Capsule (Red = Meter shift, Blue = Screen flash bomb)
class Capsule {
  constructor(x, y, isBlue = false) {
    this.x = x;
    this.y = y;
    this.w = 14;
    this.h = 10;
    this.vx = -1.1;
    this.isBlue = isBlue;
    this.alive = true;
    this.anim = 0;
  }

  update() {
    this.x += this.vx;
    this.anim += 0.1;
    if (this.x < -20) this.alive = false;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    const color = this.isBlue ? '#00e1ff' : '#ff2244';
    const highlight = this.isBlue ? '#b3f7ff' : '#ffccaa';

    // Capsule pill shape (with fallback if roundRect is unsupported)
    ctx.fillStyle = color;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(-7, -5, 14, 10, 4);
    } else {
      ctx.rect(-7, -5, 14, 10);
    }
    ctx.fill();

    ctx.fillStyle = highlight;
    ctx.beginPath();
    ctx.arc(-2, -1, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// Bullets (Player Shots, Missiles, Lasers, Enemy Bullets)
class Bullet {
  constructor(x, y, vx, vy, type = 'normal', fromPlayer = true) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.type = type; // normal, laser, missile, enemy
    this.fromPlayer = fromPlayer;
    this.alive = true;
    this.life = 120;
    this.groundSliding = false;
  }

  update(terrain) {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    if (this.type === 'missile') {
      // Missile accelerates downwards until hitting the ground, then slides rightwards!
      if (!this.groundSliding) {
        this.vy += 0.15; // Gravity
        if (terrain && terrain.isColliding(this.x, this.y + 4, 3)) {
          this.groundSliding = true;
          this.vy = 0;
          this.vx = 3.5;
        }
      } else {
        // Sliding along ground
        if (terrain && !terrain.isColliding(this.x + 4, this.y + 4, 4)) {
          this.vy = 1.0;
        }
      }
    }

    if (this.x > W + 60 || this.x < -30 || this.y < -30 || this.y > H + 30 || this.life <= 0) {
      this.alive = false;
    }
  }

  draw(ctx) {
    ctx.save();
    if (this.type === 'laser') {
      // Extended glowing laser beam
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.fillRect(this.x - 30, this.y - 2, 45, 4);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x - 20, this.y - 1, 35, 2);
    } else if (this.type === 'missile') {
      // Missile
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(this.x - 4, this.y - 2, 8, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x - 1, this.y - 1, 3, 2);
    } else if (this.type === 'double') {
      ctx.fillStyle = '#ffff44';
      ctx.fillRect(this.x - 4, this.y - 2, 8, 3);
    } else if (this.fromPlayer) {
      // Normal Shot
      ctx.fillStyle = '#ffff66';
      ctx.fillRect(this.x - 4, this.y - 2, 8, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x - 2, this.y - 1, 5, 2);
    } else {
      // Enemy projectile (Red round pellet)
      ctx.fillStyle = '#ff3322';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(this.x - 1, this.y - 1, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// Particle & Explosion system
class Particle {
  constructor(x, y, vx, vy, color, size, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.size = size;
    this.maxLife = life;
    this.life = life;
    this.alive = true;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.life <= 0) this.alive = false;
  }

  draw(ctx) {
    const alpha = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
    ctx.restore();
  }
}

// Enemies
class Enemy {
  constructor(type, x, y, options = {}) {
    this.type = type; // 'fan', 'ducker', 'hatch', 'rusher'
    this.x = x;
    this.y = y;
    this.options = options;
    this.alive = true;
    this.hp = options.hp || 1;
    this.maxHp = this.hp;
    this.isRed = options.isRed || false; // Drops capsule!
    this.timer = 0;
    this.w = 18;
    this.h = 16;
  }

  update(player, bullets, terrain) {
    this.timer++;

    if (this.type === 'fan') {
      // Sinusoidal wavy flight pattern
      this.x -= 2.2;
      this.y += Math.sin(this.timer * 0.08 + (this.options.offset || 0)) * 2.2;

      // Occasional shot
      if (this.timer % 90 === 0 && Math.random() > 0.4 && this.x > player.x + 50) {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        bullets.push(new Bullet(this.x, this.y, Math.cos(angle) * 3, Math.sin(angle) * 3, 'enemy', false));
      }
    } 
    else if (this.type === 'rusher') {
      // Straight fast swooper
      this.x -= 3.8;
    }
    else if (this.type === 'ducker') {
      // Ground walker / cannon
      this.x -= 1.0;
      if (this.timer % 70 === 0 && this.x > 50 && this.x < W - 50) {
        const angle = Math.atan2(player.y - this.y, player.x - this.x);
        bullets.push(new Bullet(this.x, this.y, Math.cos(angle) * 2.6, Math.sin(angle) * 2.6, 'enemy', false));
      }
    }
    else if (this.type === 'hatch') {
      // Spawner base in terrain
      this.x -= 1.0;
      if (this.timer % 120 === 0 && this.x > 100 && this.x < W) {
        game.spawnEnemy(new Enemy('rusher', this.x - 10, this.y));
      }
    }

    if (this.x < -40 || this.y < -40 || this.y > H + 40) {
      this.alive = false;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    const baseColor = this.isRed ? '#ff2244' : '#ffaa00';
    const darkColor = this.isRed ? '#990011' : '#885500';

    if (this.type === 'fan') {
      // Fan/Ruger drone
      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-6, -7);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-6, 7);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-2, -2, 4, 4);
    } 
    else if (this.type === 'ducker') {
      // Ground turret walker
      ctx.fillStyle = '#33cc66';
      ctx.fillRect(-8, -4, 16, 8);
      ctx.fillStyle = '#116633';
      ctx.fillRect(-6, -7, 12, 3);
      // Eye / cannon nozzle
      ctx.fillStyle = '#ff2222';
      ctx.fillRect(-2, -3, 4, 3);
    }
    else if (this.type === 'hatch') {
      // Wall Hatch
      ctx.fillStyle = '#778899';
      ctx.fillRect(-12, -10, 24, 20);
      ctx.fillStyle = '#334455';
      ctx.fillRect(-8, -6, 16, 12);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(-4, -2, 8, 4);
    }
    else {
      // Rusher
      ctx.fillStyle = '#4488ff';
      ctx.beginPath();
      ctx.moveTo(-8, -5);
      ctx.lineTo(8, 0);
      ctx.lineTo(-8, 5);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }
}

// BOSS: BIG CORE
class BigCore {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.w = 70;
    this.h = 100;
    this.alive = true;
    this.hp = 18;
    this.maxHp = 18;
    this.timer = 0;
    this.vy = 1.2;

    // 3 Barriers in front of Core
    this.barriers = [
      { x: -16, y: -16, w: 6, h: 32, hp: 5 },
      { x: -24, y: -20, w: 6, h: 40, hp: 5 },
      { x: -32, y: -24, w: 6, h: 48, hp: 5 }
    ];

    this.laserTimer = 0;
    this.firingLaser = 0; // Laser duration
  }

  update(player, bullets) {
    this.timer++;

    // Entering screen
    if (this.x > W - 110) {
      this.x -= 1.2;
    } else {
      // Hovering up and down
      this.y += this.vy;
      if (this.y < 80 || this.y > H - 80) {
        this.vy *= -1;
      }
    }

    // Big Laser Attack Routine
    this.laserTimer++;
    if (this.laserTimer % 180 === 120) {
      sound.playTone(400, 'sawtooth', 0.25, 0.2);
    }
    if (this.laserTimer % 180 >= 140 && this.laserTimer % 180 <= 165) {
      // Fire 4 huge forward lasers
      if (this.laserTimer % 5 === 0) {
        sound.laser();
        bullets.push(new Bullet(this.x - 30, this.y - 36, -8, 0, 'laser', false));
        bullets.push(new Bullet(this.x - 30, this.y - 18, -8, 0, 'laser', false));
        bullets.push(new Bullet(this.x - 30, this.y + 18, -8, 0, 'laser', false));
        bullets.push(new Bullet(this.x - 30, this.y + 36, -8, 0, 'laser', false));
      }
    }
  }

  takeDamage(dmg = 1) {
    // Check if barriers still exist
    for (let b of this.barriers) {
      if (b.hp > 0) {
        b.hp -= dmg;
        sound.playTone(260, 'square', 0.05, 0.08);
        return;
      }
    }

    // Direct hit to the vulnerable Core!
    this.hp -= dmg;
    sound.playTone(180, 'sawtooth', 0.06, 0.15);
    if (this.hp <= 0) {
      this.alive = false;
      sound.bossExplosion();
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Main Core Body (Blue & Steel Gray)
    ctx.fillStyle = '#1c253d';
    ctx.strokeStyle = '#435882';
    ctx.lineWidth = 2;

    // Central hull
    ctx.beginPath();
    ctx.rect(-10, -30, 60, 60);
    ctx.fill();
    ctx.stroke();

    // Upper Laser Arms
    ctx.fillStyle = '#263454';
    ctx.beginPath();
    ctx.moveTo(10, -30);
    ctx.lineTo(-20, -50);
    ctx.lineTo(40, -50);
    ctx.lineTo(50, -30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Lower Laser Arms
    ctx.beginPath();
    ctx.moveTo(10, 30);
    ctx.lineTo(-20, 50);
    ctx.lineTo(40, 50);
    ctx.lineTo(50, 30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 4 Laser Cannon Heads
    ctx.fillStyle = '#55aaff';
    ctx.fillRect(-26, -48, 8, 6);
    ctx.fillRect(-26, -24, 8, 6);
    ctx.fillRect(-26, 18, 8, 6);
    ctx.fillRect(-26, 42, 8, 6);

    // Glowing Core Sphere in the center!
    const coreColor = this.hp < 6 ? (this.timer % 6 < 3 ? '#ffffff' : '#ff0000') : '#00e1ff';
    const corePulse = 10 + Math.sin(this.timer * 0.15) * 2;

    ctx.fillStyle = coreColor;
    ctx.shadowColor = coreColor;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(8, 0, corePulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Core shield barriers (blue force gates in front of core)
    for (let b of this.barriers) {
      if (b.hp > 0) {
        ctx.fillStyle = b.hp > 2 ? '#00f0ff' : '#ff5533';
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
    }

    ctx.restore();
  }
}

// Floating Combat Text
class FloatingText {
  constructor(text, x, y, color = '#ffffff') {
    this.text = text;
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 60;
    this.alive = true;
  }
  update() {
    this.y -= 0.6;
    this.life--;
    if (this.life <= 0) this.alive = false;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life / 60);
    ctx.fillStyle = this.color;
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

// ==========================================
// 4. MAIN GAME CONTROLLER
// ==========================================
class GradiusGame {
  constructor() {
    this.stars = new StarField();
    this.terrain = new TerrainSystem();
    this.player = new Player();
    this.enemies = [];
    this.bullets = [];
    this.capsules = [];
    this.particles = [];
    this.floatingTexts = [];
    this.boss = null;

    this.score = 0;
    this.hiscore = 50000;
    this.lives = 3;
    this.stage = 1;
    this.worldDistance = 0;

    this.state = 'TITLE'; // TITLE, PLAYING, GAMEOVER, STAGECLEAR
    this.bossSpawned = false;
    this.shakeTimer = 0;
    this.isPaused = false;

    this.initEvents();
  }

  togglePause() {
    if (this.state !== 'PLAYING') return;
    this.isPaused = !this.isPaused;
    if (this.isPaused) {
      sound.stopBGM();
    } else {
      sound.startBGM(this.boss ? true : false);
    }
  }

  initEvents() {
    btnStartEl.addEventListener('click', () => {
      sound.init();
      this.startGame();
    });
  }

  startGame() {
    this.score = 0;
    this.lives = 3;
    this.stage = 1;
    this.worldDistance = 0;
    this.bossSpawned = false;
    this.boss = null;
    this.isPaused = false;
    this.enemies = [];
    this.bullets = [];
    this.capsules = [];
    this.particles = [];
    this.floatingTexts = [];
    this.player.reset();

    overlayEl.style.display = 'none';
    this.state = 'PLAYING';
    this.updateHUD();

    sound.startBGM(false);
  }

  triggerShot() {
    if (this.state !== 'PLAYING' || !this.player.alive) return;

    // Normal or Laser shot
    const firePoints = [{ x: this.player.x + 14, y: this.player.y }];
    const options = this.player.getOptionPositions();
    for (let opt of options) {
      firePoints.push({ x: opt.x, y: opt.y });
    }

    if (this.player.hasLaser) {
      sound.laser();
      firePoints.forEach(pt => {
        this.bullets.push(new Bullet(pt.x, pt.y, 11, 0, 'laser', true));
      });
      this.player.shotCooldown = 18;
    } else {
      sound.shot();
      firePoints.forEach(pt => {
        this.bullets.push(new Bullet(pt.x, pt.y, 8.5, 0, 'normal', true));
        if (this.player.hasDouble) {
          // Double shot: 45 degree diagonal shot
          this.bullets.push(new Bullet(pt.x, pt.y, 6.5, -6.5, 'double', true));
        }
      });
      this.player.shotCooldown = 12;
    }

    // Missile launch if equipped
    if (this.player.hasMissile && this.player.missileCooldown <= 0) {
      this.bullets.push(new Bullet(this.player.x, this.player.y + 4, 3, 2, 'missile', true));
      for (let opt of options) {
        this.bullets.push(new Bullet(opt.x, opt.y + 4, 3, 2, 'missile', true));
      }
      this.player.missileCooldown = 35;
    }
  }

  triggerPowerUp() {
    if (this.state !== 'PLAYING' || !this.player.alive) return;
    if (this.player.meterIndex < 0) return;

    const idx = this.player.meterIndex;
    let success = false;

    // Power Meter: 0:SPEED, 1:MISSILE, 2:DOUBLE, 3:LASER, 4:OPTION, 5:SHIELD
    switch (idx) {
      case 0: // SPEED UP
        if (this.player.speedLevel < 4) {
          this.player.speedLevel++;
          this.addFloatingText("SPEED UP!", this.player.x, this.player.y - 12, '#ffff00');
          success = true;
        }
        break;
      case 1: // MISSILE
        this.player.hasMissile = true;
        this.addFloatingText("MISSILE!", this.player.x, this.player.y - 12, '#ffaa00');
        success = true;
        break;
      case 2: // DOUBLE
        this.player.hasDouble = true;
        this.player.hasLaser = false; // Mutually exclusive
        this.addFloatingText("DOUBLE!", this.player.x, this.player.y - 12, '#ffff44');
        success = true;
        break;
      case 3: // LASER
        this.player.hasLaser = true;
        this.player.hasDouble = false; // Mutually exclusive
        this.addFloatingText("LASER!", this.player.x, this.player.y - 12, '#00f0ff');
        success = true;
        break;
      case 4: // OPTION
        if (this.player.optionCount < 4) {
          this.player.optionCount++;
          this.addFloatingText(`OPTION x${this.player.optionCount}!`, this.player.x, this.player.y - 12, '#ff8800');
          success = true;
        }
        break;
      case 5: // SHIELD / BARRIER
        this.player.shieldHP = 8;
        this.addFloatingText("SHIELD!", this.player.x, this.player.y - 12, '#00ffff');
        success = true;
        break;
    }

    if (success) {
      sound.powerUp();
      this.player.meterIndex = -1;
      this.updateHUD();
    }
  }

  addScore(pts) {
    this.score += pts;
    if (this.score > this.hiscore) {
      this.hiscore = this.score;
    }
    this.updateHUD();
  }

  addFloatingText(text, x, y, color) {
    this.floatingTexts.push(new FloatingText(text, x, y, color));
  }

  spawnEnemy(enemy) {
    this.enemies.push(enemy);
  }

  spawnExplosion(x, y, count = 12, color = '#ff8800') {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 1 + Math.random() * 3.5;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * spd,
        Math.sin(angle) * spd,
        color,
        2 + Math.random() * 3,
        15 + Math.random() * 20
      ));
    }
  }

  handlePlayerDeath() {
    this.player.alive = false;
    sound.playerDie();
    this.spawnExplosion(this.player.x, this.player.y, 35, '#ff2222');
    this.shakeTimer = 25;

    this.lives--;
    this.updateHUD();

    setTimeout(() => {
      if (this.lives >= 0) {
        // Respawn
        this.player.reset();
        this.updateHUD();
      } else {
        // Game Over
        this.state = 'GAMEOVER';
        sound.stopBGM();
        overlayEl.innerHTML = `
          <div class="title-logo" style="color: #ff3344;">GAME OVER</div>
          <div class="subtitle">FINAL SCORE: ${this.score}</div>
          <button id="btn-restart" class="start-btn">RETRY MISSION</button>
        `;
        overlayEl.style.display = 'flex';
        document.getElementById('btn-restart').addEventListener('click', () => {
          this.startGame();
        });
      }
    }, 1500);
  }

  updateHUD() {
    scoreValEl.textContent = String(this.score).padStart(6, '0');
    hiscoreValEl.textContent = String(this.hiscore).padStart(6, '0');
    livesValEl.textContent = Math.max(0, this.lives);
    stageValEl.textContent = this.stage;

    // Power Meter Highlight
    gaugeCells.forEach((cell, idx) => {
      cell.classList.remove('selected', 'equipped');
      if (this.player.meterIndex === idx) {
        cell.classList.add('selected');
      }
      // Show equipped state
      if (idx === 1 && this.player.hasMissile) cell.classList.add('equipped');
      if (idx === 2 && this.player.hasDouble) cell.classList.add('equipped');
      if (idx === 3 && this.player.hasLaser) cell.classList.add('equipped');
      if (idx === 4 && this.player.optionCount > 0) cell.classList.add('equipped');
      if (idx === 5 && this.player.shieldHP > 0) cell.classList.add('equipped');
    });
  }

  // Wave script generator
  manageWaveSpawns() {
    this.worldDistance += 1.0;

    // Pre-boss waves (Formation of red/yellow enemies)
    if (this.worldDistance < 2200) {
      if (this.worldDistance % 180 === 30) {
        // Spawn 4-ship red formation (all drop 1 capsule on full extermination)
        const startY = 80 + Math.random() * 180;
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            if (this.state === 'PLAYING') {
              this.spawnEnemy(new Enemy('fan', W + 20, startY, {
                offset: i * 0.4,
                isRed: i === 3 // Last one carries Red Capsule!
              }));
            }
          }, i * 220);
        }
      }

      // Ground enemies
      if (this.worldDistance > 450 && this.worldDistance % 240 === 0) {
        this.spawnEnemy(new Enemy('ducker', W + 20, H - 35));
      }
      if (this.worldDistance > 800 && this.worldDistance % 400 === 0) {
        this.spawnEnemy(new Enemy('hatch', W + 20, H - 40, { hp: 4 }));
      }
    } 
    // Boss Arrival
    else if (!this.bossSpawned) {
      this.bossSpawned = true;
      this.addFloatingText("WARNING! BIG CORE APPROACHING!", W / 2 - 140, H / 2 - 20, '#ff3344');
      sound.warning();
      setTimeout(() => {
        sound.startBGM(true);
        this.boss = new BigCore(W + 60, H / 2);
      }, 2000);
    }
  }

  update() {
    if (this.isPaused) return;

    this.stars.update();

    if (this.state !== 'PLAYING') return;

    this.terrain.update(this.worldDistance);
    this.manageWaveSpawns();
    this.player.update();

    // Terrain collision with player
    if (this.player.alive && this.player.invulnerableTimer <= 0) {
      if (this.terrain.isColliding(this.player.x, this.player.y, 6)) {
        this.handlePlayerDeath();
      }
    }

    // Update Boss
    if (this.boss) {
      if (this.boss.alive) {
        this.boss.update(this.player, this.bullets);

        // Player collision with boss
        if (this.player.alive && this.player.invulnerableTimer <= 0) {
          const dist = Math.hypot(this.player.x - this.boss.x, this.player.y - this.boss.y);
          if (dist < 45) {
            this.handlePlayerDeath();
          }
        }
      } else {
        // Boss Defeated!
        this.addScore(10000);
        this.spawnExplosion(this.boss.x, this.boss.y, 60, '#00f0ff');
        this.boss = null;
        this.state = 'STAGECLEAR';
        sound.stopBGM();
        setTimeout(() => {
          overlayEl.innerHTML = `
            <div class="title-logo" style="color: #00f0ff;">STAGE 1 CLEAR!</div>
            <div class="subtitle">CONGRATULATIONS PILOT! SCORE: ${this.score}</div>
            <button id="btn-next" class="start-btn">NEXT STAGE (LOOP)</button>
          `;
          overlayEl.style.display = 'flex';
          document.getElementById('btn-next').addEventListener('click', () => {
            this.stage++;
            this.worldDistance = 0;
            this.bossSpawned = false;
            this.boss = null;
            this.state = 'PLAYING';
            overlayEl.style.display = 'none';
            sound.startBGM(false);
          });
        }, 2500);
      }
    }

    // Update Enemies
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.update(this.player, this.bullets, this.terrain);

      // Check collision with player
      if (this.player.alive && e.alive && this.player.invulnerableTimer <= 0) {
        const dist = Math.hypot(this.player.x - e.x, this.player.y - e.y);
        if (dist < 15) {
          if (this.player.shieldHP > 0) {
            this.player.shieldHP -= 2;
            e.alive = false;
            this.spawnExplosion(e.x, e.y, 10, '#00f0ff');
          } else {
            this.handlePlayerDeath();
          }
        }
      }

      if (!e.alive) {
        this.enemies.splice(i, 1);
      }
    }

    // Update Bullets
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.update(this.terrain);

      if (b.fromPlayer) {
        // Player shot hits Boss
        if (this.boss && this.boss.alive) {
          if (b.x >= this.boss.x - 35 && b.x <= this.boss.x + 40 &&
              b.y >= this.boss.y - 45 && b.y <= this.boss.y + 45) {
            this.boss.takeDamage(b.type === 'laser' ? 2 : 1);
            this.spawnExplosion(b.x, b.y, 4, '#ffdd00');
            if (b.type !== 'laser') b.alive = false;
          }
        }

        // Player shot hits Enemy
        for (let enemy of this.enemies) {
          if (!enemy.alive) continue;
          const dist = Math.hypot(b.x - enemy.x, b.y - enemy.y);
          if (dist < 16) {
            enemy.hp--;
            if (enemy.hp <= 0) {
              enemy.alive = false;
              this.addScore(enemy.isRed ? 200 : 100);
              sound.explosion();
              this.spawnExplosion(enemy.x, enemy.y, 14, enemy.isRed ? '#ff2244' : '#ffaa00');

              // Drop Power Capsule!
              if (enemy.isRed) {
                this.capsules.push(new Capsule(enemy.x, enemy.y));
              }
            }
            if (b.type !== 'laser') b.alive = false;
            break;
          }
        }
      } else {
        // Enemy shot hits Player
        if (this.player.alive && this.player.invulnerableTimer <= 0) {
          const dist = Math.hypot(b.x - this.player.x, b.y - this.player.y);
          if (dist < 12) {
            b.alive = false;
            if (this.player.shieldHP > 0) {
              this.player.shieldHP--;
              sound.playTone(500, 'square', 0.05, 0.1);
              this.spawnExplosion(b.x, b.y, 6, '#00f0ff');
              this.updateHUD();
            } else {
              this.handlePlayerDeath();
            }
          }
        }
      }

      if (!b.alive) {
        this.bullets.splice(i, 1);
      }
    }

    // Update Capsules
    for (let i = this.capsules.length - 1; i >= 0; i--) {
      const c = this.capsules[i];
      c.update();

      // Collect Capsule
      if (this.player.alive && c.alive) {
        const dist = Math.hypot(this.player.x - c.x, this.player.y - c.y);
        if (dist < 20) {
          c.alive = false;
          sound.capsule();
          this.addScore(500);

          // Cycle Power Up Meter (0 to 5)
          this.player.meterIndex = (this.player.meterIndex + 1) % 6;
          this.updateHUD();
        }
      }

      if (!c.alive) {
        this.capsules.splice(i, 1);
      }
    }

    // Update Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update();
      if (!this.particles[i].alive) {
        this.particles.splice(i, 1);
      }
    }

    // Update Floating Texts
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      this.floatingTexts[i].update();
      if (!this.floatingTexts[i].alive) {
        this.floatingTexts.splice(i, 1);
      }
    }
  }

  draw() {
    ctx.save();

    // Screen Shake on death / big impact
    if (this.shakeTimer > 0) {
      this.shakeTimer--;
      const sx = (Math.random() - 0.5) * 6;
      const sy = (Math.random() - 0.5) * 6;
      ctx.translate(sx, sy);
    }

    // Clear background
    ctx.fillStyle = '#05070e';
    ctx.fillRect(0, 0, W, H);

    // Starfield
    this.stars.draw(ctx);

    // Terrain
    this.terrain.draw(ctx);

    // Capsules
    for (let c of this.capsules) c.draw(ctx);

    // Bullets
    for (let b of this.bullets) b.draw(ctx);

    // Enemies
    for (let e of this.enemies) e.draw(ctx);

    // Boss
    if (this.boss && this.boss.alive) {
      this.boss.draw(ctx);
    }

    // Player
    this.player.draw(ctx);

    // Particles
    for (let p of this.particles) p.draw(ctx);

    // Floating Text
    for (let t of this.floatingTexts) t.draw(ctx);

    // Pause Overlay
    if (this.isPaused) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffdd33';
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('- PAUSED -', W / 2, H / 2);
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('PRESS [P] TO RESUME', W / 2, H / 2 + 25);
      ctx.textAlign = 'start';
    }

    ctx.restore();
  }
}

// Game instance & Main Loop
const game = new GradiusGame();

function gameLoop() {
  game.update();
  game.draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
